apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-mcp
  namespace: daniel-fte
  labels:
    app: social-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-mcp
  template:
    metadata:
      labels:
        app: social-mcp
    spec:
      containers:
        - name: social-mcp
          image: daniel-fte/social-mcp:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: fte-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: social-mcp
  namespace: daniel-fte
spec:
  selector:
    app: social-mcp
  ports:
    - port: 8080
      targetPort: 8080
