apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: daniel-fte
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: daniel-fte/orchestrator:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fte-config
            - secretRef:
                name: fte-secrets
          env:
            - name: VAULT_PATH
              value: "/app/vault"
          volumeMounts:
            - name: vault
              mountPath: /app/vault
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: vault-pvc
