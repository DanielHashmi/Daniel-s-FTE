version: "3.9"

services:
  db:
    image: postgres:16
    container_name: daniel-fte-odoo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ODOO_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${ODOO_POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_POSTGRES_USER:-odoo} -d ${ODOO_POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - odoo-net

  odoo:
    image: ${ODOO_IMAGE:-odoo:19.0}
    container_name: daniel-fte-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${ODOO_POSTGRES_USER:-odoo}
      PASSWORD: ${ODOO_POSTGRES_PASSWORD}
      DB_NAME: ${ODOO_POSTGRES_DB:-postgres}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    expose:
      - "8069"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8069/web/login', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - odoo-net

  db-backup:
    image: tiredofit/db-backup:latest
    container_name: daniel-fte-odoo-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: pgsql
      DB_HOST: db
      DB_NAME: ${ODOO_POSTGRES_DB:-postgres}
      DB_USER: ${ODOO_POSTGRES_USER:-odoo}
      DB_PASS: ${ODOO_POSTGRES_PASSWORD}
      BACKUP_LOCATION: /backup
      BACKUP_INTERVAL: ${ODOO_BACKUP_INTERVAL_SECONDS:-86400}
      CLEANUP_TIME: ${ODOO_BACKUP_RETENTION_SECONDS:-1209600}
      COMPRESSION: GZ
    volumes:
      - db-backups:/backup
    networks:
      - odoo-net

  caddy:
    image: caddy:2
    container_name: daniel-fte-odoo-caddy
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - odoo-net

volumes:
  odoo-data:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:

networks:
  odoo-net:
    driver: bridge
